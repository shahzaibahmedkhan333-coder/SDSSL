<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Analysis Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heatmap.js"></script>
    <style>
        body {
            background: url('https://source.unsplash.com/1600x900/?city,crime') no-repeat center center/cover;
            color: white;
            padding-top: 80px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        .navbar {
            background: rgba(0, 0, 0, 0.8) !important;
        }
        .navbar-brand, .nav-link {
            color: white !important;
            transition: 0.3s;
        }
        .nav-link:hover {
            color: #ffcc00 !important;
        }
        .form-select {
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            padding: 15px;
        }
        canvas {
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            padding: 15px;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Crime Analysis</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/provincial_crime_analysis">Provincial Crime Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ctd_data_analysis">CTD Data Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="/hotspot_analysis">Hotspot Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about-section">About</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">
    <h2 class="text-center text-dark fw-bold">Crime Analysis Dashboard</h2>
    <div class="row mt-4">
        <div class="col-md-4">
            <label class="form-label text-dark fw-bold">Select Year:</label>
            <select id="yearSelect" class="form-select">
                <option value="">Choose Year</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label text-dark fw-bold">Select Crime Type:</label>
            <select id="crimeSelect" class="form-select">
                <option value="">Choose Crime Type</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label text-dark fw-bold">Select Province:</label>
            <select id="provinceSelect" class="form-select">
                <option value="">Choose Province</option>
            </select>
        </div>
    </div>

    <div class="card mt-4">
        <h4 class="text-dark fw-bold">Crime Data:</h4>
        <p id="crimeData" class="fw-bold text-danger"></p>
    </div>

    <!-- Chart Section -->
    <canvas id="barChart"></canvas>
    <canvas id="lineChart"></canvas>
    <canvas id="pieChart"></canvas>
    <canvas id="histChart"></canvas>
    <div id="heatmapContainer"></div>
</div>

<!-- JavaScript -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const crimeData = [
    { Year: 2012, Offence: "Murder", Punjab: 6128, Sindh: 3726, KP: 2958, Balochistan: 711 },
    { Year: 2012, Offence: "Attempt to Murder", Punjab: 7641, Sindh: 3732, KP: 2892, Balochistan: 583 },
    { Year: 2012, Offence: "Kidnapping /Abduction", Punjab: 15699, Sindh: 3077, KP: 1052, Balochistan: 386 },
    { Year: 2012, Offence: "Dacoity", Punjab: 2715, Sindh: 1341, KP: 60, Balochistan: 98 },
    { Year: 2012, Offence: "Robbery", Punjab: 12181, Sindh: 4320, KP: 134, Balochistan: 160 },
    { Year: 2012, Offence: "Burglary", Punjab: 14740, Sindh: 1680, KP: 500, Balochistan: 117 },
    { Year: 2013, Offence: "Murder", Punjab: 5969, Sindh: 3854, KP: 3163, Balochistan: 639 },
    { Year: 2013, Offence: "Attempt to Murder", Punjab: 6935, Sindh: 3568, KP: 3146, Balochistan: 482 },
    { Year: 2013, Offence: "Kidnapping /Abduction", Punjab: 14527, Sindh: 3149, KP: 1137, Balochistan: 304 },
    { Year: 2013, Offence: "Dacoity", Punjab: 2479, Sindh: 1354, KP: 66, Balochistan: 85 },
    { Year: 2013, Offence: "Robbery", Punjab: 12609, Sindh: 4045, KP: 145, Balochistan: 189 },
    { Year: 2013, Offence: "Burglary", Punjab: 13912, Sindh: 1651, KP: 653, Balochistan: 156 },
    { Year: 2014, Offence: "Murder", Punjab: 5953, Sindh: 3225, KP: 3184, Balochistan: 615 },
    { Year: 2014, Offence: "Attempt to Murder", Punjab: 7204, Sindh: 3017, KP: 3281, Balochistan: 465 },
    { Year: 2014, Offence: "Kidnapping /Abduction", Punjab: 14247, Sindh: 2947, KP: 1277, Balochistan: 268 },
    { Year: 2014, Offence: "Dacoity", Punjab: 1984, Sindh: 1320, KP: 77, Balochistan: 67 },
    { Year: 2014, Offence: "Robbery", Punjab: 13808, Sindh: 3433, KP: 199, Balochistan: 202 },
    { Year: 2014, Offence: "Burglary", Punjab: 14206, Sindh: 1387, KP: 778, Balochistan: 143 },
    { Year: 2015, Offence: "Murder", Punjab: 4422, Sindh: 1907, KP: 2496, Balochistan: 412 },
    { Year: 2015, Offence: "Attempt to Murder", Punjab: 5234, Sindh: 2280, KP: 3008, Balochistan: 356 },
    { Year: 2015, Offence: "Kidnapping /Abduction", Punjab: 13378, Sindh: 2963, KP: 1165, Balochistan: 246 },
    { Year: 2015, Offence: "Dacoity", Punjab: 1318, Sindh: 858, KP: 50, Balochistan: 66 },
    { Year: 2015, Offence: "Robbery", Punjab: 11871, Sindh: 2595, KP: 234, Balochistan: 186 },
    { Year: 2015, Offence: "Burglary", Punjab: 12762, Sindh: 1323, KP: 878, Balochistan: 162 },
    { Year: 2016, Offence: "Murder", Punjab: 3995, Sindh: 1445, KP: 2481, Balochistan: 382 },
    { Year: 2016, Offence: "Attempt to Murder", Punjab: 4647, Sindh: 1955, KP: 2900, Balochistan: 340 },
    { Year: 2016, Offence: "Kidnapping /Abduction", Punjab: 13349, Sindh: 2891, KP: 1214, Balochistan: 215 },
    { Year: 2016, Offence: "Dacoity", Punjab: 825, Sindh: 707, KP: 58, Balochistan: 30 },
    { Year: 2016, Offence: "Robbery", Punjab: 10078, Sindh: 2409, KP: 206, Balochistan: 160 },
    { Year: 2016, Offence: "Burglary", Punjab: 11586, Sindh: 1472, KP: 840, Balochistan: 154 },
    { Year: 2017, Offence: "Murder", Punjab: 3914, Sindh: 1409, KP: 2361, Balochistan: 325 },
    { Year: 2017, Offence: "Attempt to Murder", Punjab: 4440, Sindh: 1644, KP: 2641, Balochistan: 333 },
    { Year: 2017, Offence: "Kidnapping /Abduction", Punjab: 13558, Sindh: 2927, KP: 1197, Balochistan: 248 },
    { Year: 2017, Offence: "Dacoity", Punjab: 602, Sindh: 572, KP: 45, Balochistan: 38 },
    { Year: 2017, Offence: "Robbery", Punjab: 9385, Sindh: 2364, KP: 276, Balochistan: 185 },
    { Year: 2017, Offence: "Burglary", Punjab: 11023, Sindh: 1344, KP: 798, Balochistan: 135 }
];

        function populateDropdowns() {
            const years = [...new Set(crimeData.map(item => item.Year))];
            years.forEach(year => {
                document.getElementById("yearSelect").innerHTML += `<option value="${year}">${year}</option>`;
            });

            const crimes = [...new Set(crimeData.map(item => item.Offence))];
            crimes.forEach(crime => {
                document.getElementById("crimeSelect").innerHTML += `<option value="${crime}">${crime}</option>`;
            });

            const provinces = ["Punjab", "Sindh", "KP", "Balochistan"];
            provinces.forEach(province => {
                document.getElementById("provinceSelect").innerHTML += `<option value="${province}">${province}</option>`;
            });
        }

        function updateCrimeData() {
            const year = document.getElementById("yearSelect").value;
            const crime = document.getElementById("crimeSelect").value;
            const province = document.getElementById("provinceSelect").value;
            const crimeInfo = crimeData.find(item => item.Year == year && item.Offence == crime);

            if (crimeInfo) {
                document.getElementById("crimeData").textContent = `In ${year}, ${crime} cases in ${province} were ${crimeInfo[province] || "N/A"}.`;
            } else {
                document.getElementById("crimeData").textContent = "No data available.";
            }
        }

        function generateCharts() {
            new Chart(document.getElementById("barChart"), {
                type: 'bar',
                data: { labels: ["Punjab", "Sindh", "KP", "Balochistan"], datasets: [{ label: "Crimes", data: [5000, 3000, 2000, 700], backgroundColor: "blue" }] }
            });

            new Chart(document.getElementById("lineChart"), {
                type: 'line',
                data: { labels: ["2020", "2021"], datasets: [{ label: "Murder Cases", data: [5000, 5200], borderColor: "red", fill: false }] }
            });

            new Chart(document.getElementById("pieChart"), {
                type: 'pie',
                data: { labels: ["Punjab", "Sindh", "KP", "Balochistan"], datasets: [{ label: "Crime Distribution", data: [5000, 3000, 2000, 700], backgroundColor: ["blue", "red", "green", "yellow"] }] }
            });
        }

        document.querySelectorAll("select").forEach(select => select.addEventListener("change", updateCrimeData));
        populateDropdowns();
        generateCharts();
    });
</script>
</body>
</html>
