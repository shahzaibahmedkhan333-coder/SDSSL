<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Risk Zones in Pakistan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
        }
        .navbar {
            margin-bottom: 20px;
        }
        #map {
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .container h1 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">GLOF Monitoring</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="riskAssessmentDropdown" role="button" data-bs-toggle="dropdown">
                            Risk Assessment
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Overall Risk</a></li>
                            <li><a class="dropdown-item" href="flood-risk-zones.html">Flood Risk Zones</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center text-primary">Flood Risk Zones in Pakistan</h1>
        <div id="map"></div>
        <div class="filters">
            <h3>Filters:</h3>
            <form id="filtersForm" class="row">
                <div class="col-md-4">
                    <label for="region" class="form-label">Region</label>
                    <select id="region" class="form-select">
                        <option value="all">All</option>
                        <option value="gilgit-baltistan">Gilgit-Baltistan</option>
                        <option value="chitral">Chitral</option>
                        <option value="swat">Swat</option>
                        <option value="punjab">Punjab</option>
                        <option value="sindh">Sindh</option>
                        <option value="kpk">Khyber Pakhtunkhwa</option>
                        <option value="balochistan">Balochistan</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="severity" class="form-label">Risk Level</label>
                    <select id="severity" class="form-select">
                        <option value="all">All</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="severe">Severe</option>
                    </select>
                </div>
                <div class="col-md-4 mt-4">
                    <button type="button" id="applyFilters" class="btn btn-primary mt-2">Apply Filters</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="flood-risk-zones.js"></script>
</body>
</html>
