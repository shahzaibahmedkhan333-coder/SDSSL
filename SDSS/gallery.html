    body {

      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    /* Navbar */
    .navbar {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      transition: all 0.4s ease;
    }
    .navbar-nav .nav-link {
      color: #fff !important;
      font-weight: 500;
      transition: 0.3s;
    }
    .navbar-nav .nav-link:hover {
      color: #f8d90f !important;
      transform: translateY(-3px);
    }

    /* Section Titles */
    h1, h2 {
      text-align: center;
      font-weight: bold;
      margin-bottom: 40px;
      color: #f8d90f;
      text-shadow: 0 0 10px rgba(248,217,15,0.6);
    }

    /* Gallery Grid */
    .gallery-img {
      width: 100%;
      height: 250px; /* fixed uniform size */
      object-fit: cover;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }
    .gallery-img:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 30px rgba(248,217,15,0.6);
    }

    /* Modal */
    .modal-content {
      background: transparent;
      border: none;
    }
    .modal-body {
      padding: 0;
    }
    .modal-img {
      height: 75vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    /* Carousel Controls */
    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      filter: invert(1);
      width: 40px;
      height: 40px;
    }
    .carousel-control-prev:hover,
    .carousel-control-next:hover {
      transform: scale(1.1);
    }
  </style>

  <script>
    // Link grid thumbnails to modal carousel
    const galleryImgs = document.querySelectorAll(".gallery-img");
    const lightboxCarousel = document.querySelector("#lightboxCarousel");

    galleryImgs.forEach((img, index) => {
      img.addEventListener("click", () => {
        const bsCarousel = bootstrap.Carousel.getOrCreateInstance(lightboxCarousel);
        bsCarousel.to(index);
      });
    });
