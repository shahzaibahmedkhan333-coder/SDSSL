<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - SDSS Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f0f9ff);
    }
    .contact-header {
      background: linear-gradient(to right, #0d6efd, #00b4d8);
      color: white;
      padding: 80px 20px;
      text-align: center;
      border-radius: 0 0 40px 40px;
    }
    .contact-header h1 {
      font-size: 2.8rem;
      font-weight: bold;
    }
    .contact-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      padding: 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .contact-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .contact-icon {
      font-size: 2rem;
      color: #0d6efd;
      margin-right: 15px;
    }
    .social-icons a {
      font-size: 1.5rem;
      margin: 0 10px;
      color: #0d6efd;
      transition: color 0.3s ease;
    }
    .social-icons a:hover {
      color: #00b4d8;
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <div class="contact-header">
    <h1>📞 Contact Us</h1>
    <p>We’d love to hear from you! Reach out to our lab using the details below.</p>
  </div>

  <!-- Contact Info -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="contact-card">

          <h3 class="mb-4 text-center">Spatial Decision Support System Lab (SDSSL)</h3>

          <p><i class="fas fa-map-marker-alt contact-icon"></i>
            Blue chip Laboratories, Takatu campus, <strong>BUITEMS, Quetta</strong>
          </p>

          <p><i class="fas fa-envelope contact-icon"></i>
            <a href="mailto:SDSSLab.BUITEMS@buitms.edu.pk">SDSSLab.BUITEMS@buitms.edu.pk</a>
          </p>

          <p><i class="fas fa-phone contact-icon"></i>
            +92 (81) 2899911 Ext: (547)
          </p>

          <!-- Social Links -->
          <div class="social-icons text-center mt-4">
            <a href="https://www.spatial-decision-support-system-lab-official.com" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://www.facebook.com/SDSSLab" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://twitter.com/SDSSLab" target="_blank"><i class="fab fa-twitter"></i></a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
